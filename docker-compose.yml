services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_payroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_payroll
      POSTGRES_PASSWORD: hr_payroll_dev
      POSTGRES_DB: hr_payroll
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_payroll"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
